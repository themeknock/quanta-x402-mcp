# Dormant on purpose.
#
# `workflow_dispatch` only: this never fires on a push. Quanta is deployed by
# hand (`npm run deploy`) and stays that way until there is a reason for CI to
# hold a deploy token. To turn it on, add a CLOUDFLARE_API_TOKEN repository
# secret and uncomment the `push` trigger below.
name: deploy

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
